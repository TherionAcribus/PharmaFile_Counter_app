[pytest]
testpaths = tests

# Les tests Qt tournent sans affichage : conftest.py pose déjà QT_QPA_PLATFORM
# et crée UNE seule QApplication partagée pour toute la session (mélanger
# QCoreApplication et QApplication dans un même processus fait planter Qt).
addopts = -q

filterwarnings =
    # Une séquence d'échappement invalide dans une chaîne est un défaut : elle
    # doit échouer les tests, pas passer en avertissement discret (ruff W605
    # l'attrape aussi, ceinture et bretelles).
    error::SyntaxWarning
