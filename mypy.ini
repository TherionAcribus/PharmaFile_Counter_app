# Vérification de types du client comptoir (point 10.7).
#
# Périmètre : TOUT le code applicatif, mais en mode « erreurs réelles » — les
# fonctions sans annotations ne sont pas vérifiées (le code est majoritairement
# non annoté). Ce qui est attrapé : attributs inexistants, mauvais types dans le
# code déjà annoté (les modules purs le sont), retours incohérents, imports
# cassés. C'est le pendant « typage » du socle ruff : zéro bruit, zéro
# annotation à écrire, mais une régression réelle bloque la CI.
#
# Pour durcir progressivement : ajouter une section [mypy-<module>] avec
# disallow_untyped_defs = True sur les modules purs déjà annotés.

[mypy]
python_version = 3.12
files = .
exclude = (?x)(^\.venv/ | ^build/ | ^dist/ | ^tests/ | ^tools/)

# Les paquets tiers sans annotations (keyboard, socketio, requests…) ne doivent
# pas faire échouer l'analyse.
ignore_missing_imports = True

# Erreurs qui comptent, sans exiger d'annoter le code existant.
check_untyped_defs = False
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
