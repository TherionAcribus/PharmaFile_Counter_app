name: ci

on:
  push:
  pull_request:

jobs:
  # --- Lint + typage (bloquant) --------------------------------------------
  # Périmètre volontairement restreint à de VRAIES erreurs (cf. ruff.toml et
  # mypy.ini) : le job est vert sur le code existant sans campagne de style,
  # mais il bloque les régressions réelles (import mort, variable morte,
  # `except:` nu, attribut inexistant…).
  lint:
    name: lint (ruff) + typage (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils de qualité
        run: pip install ruff==0.6.9 mypy==1.11.2

      - name: Ruff
        run: ruff check .

      # PySide6 est nécessaire pour que mypy résolve les annotations Qt.
      - name: Installer PySide6 (annotations Qt)
        run: pip install -r requirements.txt

      - name: Mypy
        run: mypy --config-file mypy.ini

  deps-and-tests:
    name: audit des dépendances + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bibliothèques système requises par les greffons Qt de PySide6 en mode
      # « offscreen » (les tests tournent sans affichage).
      # libpulse0 : PySide6.QtMultimedia (importé par audio.py, donc par main/
      # preferences et une grande partie des tests) est LIÉ à libpulse.so.0 —
      # sans elle l'import échoue à la collecte pytest (exit 2). libasound :
      # backend audio ALSA de QtMultimedia.
      - name: Dépendances système Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0
          # Noble (24.04) a renommé libasound2 en libasound2t64.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Installer les dépendances (runtime + tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Vérifie que toute dépendance tierce importée par le client est déclarée
      # et qu'aucun paquet serveur ne s'est glissé dans les fichiers de deps.
      - name: Audit des dépendances déclarées
        run: python tools/check_dependencies.py

      # Garde-fou accessibilité (point 28) : aucun skin ne doit repasser sous le
      # contraste AA sur le texte actif.
      - name: Audit du contraste des skins
        run: python tools/check_contrast.py

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
