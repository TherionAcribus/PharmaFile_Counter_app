name: release

# Pousser un tag « v* » (ex: v1.0.0) déclenche la compilation Windows des deux
# formats (dossier + exe unique) puis la publication d'une release GitHub avec
# les artefacts en pièces jointes.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: build + release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Installer les dépendances de build
        run: pip install -r requirements-build.txt

      # Exe unique autonome -> dist/PharmaFile.exe
      - name: Compiler l'EXE autonome (onefile)
        run: pyinstaller --noconfirm --clean PharmaFile_onefile.spec

      # Dossier exe + _internal -> dist/PharmaFile_v3/
      - name: Compiler le dossier (onedir)
        run: pyinstaller --noconfirm --clean PharmaFile.spec

      - name: Préparer les artefacts
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Move-Item dist/PharmaFile.exe "release-assets/PharmaFile-$tag-win64.exe"
          Compress-Archive -Path dist/PharmaFile_v3 -DestinationPath "release-assets/PharmaFile-$tag-win64.zip"

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag release-assets/* --clobber
          } else {
            gh release create $tag release-assets/* --title $tag --generate-notes
          }
